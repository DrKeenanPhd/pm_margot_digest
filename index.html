<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Effortless AI — Property Manager's Instant Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f3f1ec;
    --ink: #15140f;
    --muted: #6b675d;
    --card: #26262a;
    --card-2: #1d1d20;
    --line: rgba(255,255,255,.08);
    --p1: #e5484d; --p2: #f5820b; --p3: #e3b40a; --p4: #2faa55;
    --accent: #991b1b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { padding: 26px 0 14px; }
  .kicker { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 2.1rem; line-height: 1.02; margin: 4px 0 2px; letter-spacing: -.02em; }
  .datemeta { color: var(--muted); font-size: .9rem; }

  .controls { position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg) 72%, rgba(243,241,236,0)); padding: 10px 0 12px; }
  .chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1.5px solid #d8d4ca; background: #fff; color: var(--ink); font-weight: 700; font-size: .82rem; padding: 8px 13px; border-radius: 999px; cursor: pointer; transition: .15s; }
  .chip[data-active="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align: middle; }
  .sortrow { display:flex; justify-content:space-between; align-items:center; margin-top:11px; }
  .count { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .sortbtn { border:none; background:none; font: inherit; font-weight:700; font-size:.85rem; color: var(--accent); cursor:pointer; display:flex; align-items:center; gap:5px; }

  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .card { background: var(--card); color:#fff; border-radius: 16px; overflow:hidden; box-shadow: 0 6px 18px rgba(0,0,0,.10); border: 1px solid var(--line); }
  .card .bar { height: 4px; }
  .card .body { padding: 15px 16px 16px; }
  .row1 { display:flex; align-items:center; gap:9px; margin-bottom: 8px; }
  .badge { font-weight: 800; font-size: .74rem; letter-spacing:.04em; padding: 4px 9px; border-radius: 7px; color:#fff; }
  .time { margin-left:auto; font-size:.78rem; color:#b8b5ad; font-variant-numeric: tabular-nums; }
  .name { font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:1.12rem; letter-spacing:-.01em; }
  .summary { color:#d6d3cb; font-size:.93rem; line-height:1.45; margin:6px 0 13px; }
  .actions { display:flex; gap:9px; flex-wrap:wrap; }
  .act { flex:1 1 auto; text-align:center; text-decoration:none; font-weight:700; font-size:.86rem; padding:11px 10px; border-radius:11px; min-width:96px; }
  .act.call { background:#fff; color:#15140f; }
  .act.rec { background:#33333a; color:#fff; border:1px solid var(--line); }
  .act.tr { background:#33333a; color:#fff; border:1px solid var(--line); cursor:pointer; }
  .act.disabled { opacity:.4; pointer-events:none; }

  .empty, .err { text-align:center; color:var(--muted); padding:48px 16px; }
  .err { color:#9b2c2c; }
  .skeleton { height:118px; border-radius:16px; background:linear-gradient(100deg,#e7e3da 30%,#efece4 50%,#e7e3da 70%); background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }

  /* transcript sheet */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:.2s; z-index:20; }
  .sheet-bg.open { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; max-height:82vh; background:var(--bg); border-radius:20px 20px 0 0; transform:translateY(100%); transition:.25s cubic-bezier(.2,.8,.2,1); z-index:21; display:flex; flex-direction:column; padding-bottom: env(safe-area-inset-bottom); }
  .sheet.open { transform:translateY(0); }
  .sheet h3 { font-family:"Bricolage Grotesque",sans-serif; margin:0; font-size:1.15rem; }
  .sheet .top { display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; border-bottom:1px solid #ddd8cd; }
  .sheet .x { border:none; background:#e4e0d6; width:32px; height:32px; border-radius:50%; font-size:1.1rem; cursor:pointer; }
  .sheet .content { overflow-y:auto; padding:16px 18px; white-space:pre-wrap; line-height:1.55; font-size:.95rem; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">Effortless AI · Property Manager's Instant Response</div>
      <h1>Today's Calls</h1>
      <div class="datemeta" id="datemeta">Loading…</div>
    </header>

    <div class="controls">
      <div class="chips" id="chips">
        <button class="chip" data-f="all" data-active="true">All</button>
        <button class="chip" data-f="P1"><span class="dot" style="background:var(--p1)"></span>P1</button>
        <button class="chip" data-f="P2"><span class="dot" style="background:var(--p2)"></span>P2</button>
        <button class="chip" data-f="P3"><span class="dot" style="background:var(--p3)"></span>P3</button>
        <button class="chip" data-f="P4"><span class="dot" style="background:var(--p4)"></span>P4</button>
      </div>
      <div class="sortrow">
        <span class="count" id="count"></span>
        <button class="sortbtn" id="sortbtn">↓ Newest first</button>
      </div>
    </div>

    <div class="list" id="list">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>

  <div class="sheet-bg" id="sheetbg"></div>
  <div class="sheet" id="sheet">
    <div class="top"><h3 id="sheetTitle">Transcript</h3><button class="x" id="sheetX">×</button></div>
    <div class="content" id="sheetContent">Loading…</div>
  </div>

<script>
  const P = {
    P1:{c:"var(--p1)",label:"P1 · CRITICAL"}, P2:{c:"var(--p2)",label:"P2 · URGENT"},
    P3:{c:"var(--p3)",label:"P3 · HIGH"}, P4:{c:"var(--p4)",label:"P4 · STANDARD"}
  };
  let calls = [], filter = "all", desc = true;

  const fmtTime = t => { if(!t) return ""; const d=new Date(t); return isNaN(d)?"":d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); };

  function render(){
    const list = document.getElementById("list");
    let rows = calls.filter(c => filter==="all" ? true : (c.priority||"").toUpperCase().startsWith(filter));
    rows.sort((a,b)=> (desc?-1:1)*((new Date(a.time||0))-(new Date(b.time||0))));
    document.getElementById("count").textContent = rows.length + (rows.length===1?" call":" calls");
    if(!rows.length){ list.innerHTML = '<div class="empty">No calls match this filter today.</div>'; return; }
    list.innerHTML = rows.map(c=>{
      const pk = (c.priority||"").toUpperCase().slice(0,2);
      const meta = P[pk] || {c:"#888",label:(c.priority||"Unclassified")};
      const phoneDigits = (c.phone||"").replace(/[^0-9+]/g,"");
      return `<div class="card">
        <div class="bar" style="background:${meta.c}"></div>
        <div class="body">
          <div class="row1">
            <span class="badge" style="background:${meta.c}">${meta.label}</span>
            <span class="time">${fmtTime(c.time)}</span>
          </div>
          <div class="name">${esc(c.name||"Unknown caller")}</div>
          ${c.summary?`<div class="summary">${esc(c.summary)}</div>`:'<div class="summary" style="opacity:.5">No summary captured.</div>'}
          <div class="actions">
            <a class="act call ${phoneDigits?'':'disabled'}" href="${phoneDigits?'tel:'+phoneDigits:'#'}">Call back</a>
            <a class="act rec ${c.recordingUrl?'':'disabled'}" href="${c.recordingUrl||'#'}" target="_blank" rel="noopener">Recording</a>
            <button class="act tr ${(c.hasTranscript||c.id)?'':'disabled'}" data-id="${c.id||''}" data-name="${esc(c.name||'')}">Transcript</button>
          </div>
        </div></div>`;
    }).join("");
    list.querySelectorAll(".act.tr").forEach(b=> b.addEventListener("click",()=>openTranscript(b.dataset.id,b.dataset.name)));
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

  async function openTranscript(id,name){
    if(!id) return;
    const bg=document.getElementById("sheetbg"), sh=document.getElementById("sheet");
    document.getElementById("sheetTitle").textContent = name ? name+" — transcript" : "Transcript";
    document.getElementById("sheetContent").textContent = "Loading…";
    bg.classList.add("open"); sh.classList.add("open");
    try{
      const r=await fetch("/api/call/"+encodeURIComponent(id)); const d=await r.json();
      // field path to confirm against /api/debug:
      const t = d.transcript || d.callLog?.transcript || d.data?.transcript || JSON.stringify(d,null,2);
      document.getElementById("sheetContent").textContent = t || "No transcript available.";
    }catch(e){ document.getElementById("sheetContent").textContent = "Could not load transcript."; }
  }
  function closeSheet(){ document.getElementById("sheetbg").classList.remove("open"); document.getElementById("sheet").classList.remove("open"); }
  document.getElementById("sheetX").addEventListener("click",closeSheet);
  document.getElementById("sheetbg").addEventListener("click",closeSheet);

  document.getElementById("chips").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    document.querySelectorAll(".chip").forEach(c=>c.dataset.active="false");
    b.dataset.active="true"; filter=b.dataset.f; render();
  });
  document.getElementById("sortbtn").addEventListener("click",e=>{
    desc=!desc; e.currentTarget.textContent = desc ? "↓ Newest first" : "↑ Oldest first"; render();
  });

  (async function load(){
    try{
      const r=await fetch("/api/today"); const d=await r.json();
      if(d.error){ document.getElementById("list").innerHTML='<div class="err">'+esc(d.error)+'</div>'; document.getElementById("datemeta").textContent=""; return; }
      calls=d.calls||[];
      const dd=new Date((d.date||"")+"T12:00:00");
      document.getElementById("datemeta").textContent = (isNaN(dd)?d.date:dd.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"})) + " · " + (d.tz||"");
      render();
    }catch(e){ document.getElementById("list").innerHTML='<div class="err">Could not reach the server.</div>'; }
  })();
</script>
</body>
</html>
