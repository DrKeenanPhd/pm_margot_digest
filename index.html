<!DOCTYPE html>
<html lang="en">
<head>
<!-- VERSION: v1.4.0 (2026-06-15)
     CHANGELOG:
     - v1.4.0  Export CSV button (downloads current scope as accountability call log).
     - v1.3.0  Date scopes: Today / Yesterday / Last 7 days (grouped) / Pending (unhandled backlog).
     - v1.2.0  Re-skin to match EffortlessAI brand (white, electric blue, green, Archivo, wordmark).
     - v1.1.0  Branded notification-format detail sheet (SMS layout, caller-state emoji,
               Map link, OK/DONE/ESC lines), "Powered by AI Alive" footer, contactId for tagging.
     - v1.0.0  Property-headline cards, P/S badges, tap-to-open sheet, recording, mark-handled. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Effortless AI — Property Manager's Instant Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff; --band:#f4f7fb; --ink:#0e1626; --muted:#5a6573; --line:#e6e9ef;
    --brand:#2a64f6; --green:#16a34a;
    --p1:#e5484d; --p2:#f5820b; --p3:#e3b40a; --p4:#22a85a;
    --s1:#e5484d; --s2:#8b3fd6; --s3:#2f6fed; --s4:#22a85a;
    --su:#8b3fd6;
    --notif:#1b2130;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 48px);-webkit-font-smoothing:antialiased}
  .wrap{max-width:600px;margin:0 auto;padding:0 16px}

  header{padding:20px 0 8px}
  .brand{font-weight:900;font-size:1.4rem;letter-spacing:-.02em}
  .brand .ai{color:var(--green)}
  .kicker{display:inline-block;margin:14px 0 8px;background:rgba(42,100,246,.10);color:var(--brand);
    font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
  h1{font-weight:900;font-size:2.15rem;line-height:1;margin:0 0 4px;letter-spacing:-.03em}
  .datemeta{color:var(--muted);font-size:.92rem;font-weight:500}
  .scopes{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
  .scopes::-webkit-scrollbar{display:none}
  .scope{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:.85rem;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .scope[data-active="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .daygroup{font-weight:800;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 2px 4px}
  .daygroup.first{margin-top:6px}

  .controls{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 76%,rgba(255,255,255,0));padding:12px 0}
  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:.8rem;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
  .chip[data-active="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .sep{flex:0 0 auto;width:1px;background:var(--line);margin:4px 3px}
  .sortrow{display:flex;justify-content:space-between;align-items:center;margin-top:11px;gap:10px;flex-wrap:wrap}
  .count{font-size:.85rem;color:var(--muted);font-weight:600}
  .rightctl{display:flex;align-items:center;gap:14px}
  .togglebtn,.sortbtn,.exportbtn{border:none;background:none;font:inherit;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--brand);display:flex;align-items:center;gap:5px}
  .exportbtn{font-weight:800}
  .togglebtn{color:var(--muted)}
  .togglebtn[data-on="true"]{color:var(--ink)}

  .list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(14,22,38,.06);transition:.2s}
  .card.resolved{opacity:.5}
  .card .bar{height:5px}
  .card .body{padding:14px 15px 15px}
  .row1{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
  .badge{font-weight:800;font-size:.7rem;letter-spacing:.03em;padding:4px 9px;border-radius:7px;color:#fff}
  .badge.unc{background:#8a93a3}
  .pill{font-size:.64rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#eef1f6;color:#5a6573}
  .time{margin-left:auto;font-size:.78rem;color:#9aa3b1;font-weight:600;font-variant-numeric:tabular-nums}
  .prop{font-weight:800;font-size:1.18rem;letter-spacing:-.01em;line-height:1.12}
  .who{color:var(--muted);font-size:.87rem;margin-top:2px;font-weight:500}
  .line{color:#3a4452;font-size:.93rem;line-height:1.4;margin:8px 0 13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .act{flex:1 1 auto;text-align:center;text-decoration:none;font-weight:800;font-size:.84rem;padding:11px 8px;border-radius:11px;min-width:84px;border:none;cursor:pointer}
  .act.call{background:var(--brand);color:#fff}
  .act.rec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .act.done{background:#eafaf0;color:#128a43;border:1.5px solid #c4ecd2}
  .act.done[data-done="true"]{background:var(--green);color:#fff;border-color:var(--green)}
  .audio{margin-top:10px;width:100%}
  .audio audio{width:100%;height:38px}

  .empty,.err{text-align:center;color:var(--muted);padding:46px 16px}
  .err{color:#c0362f}
  .skeleton{height:120px;border-radius:16px;background:linear-gradient(100deg,#eef1f6 30%,#f6f8fb 50%,#eef1f6 70%);background-size:200% 100%;animation:sh 1.2s infinite;border:1px solid var(--line)}
  @keyframes sh{to{background-position:-200% 0}}

  .sheet-bg{position:fixed;inset:0;background:rgba(14,22,38,.42);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:.25s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 40px rgba(14,22,38,.18)}
  .sheet.open{transform:translateY(0)}
  .sheet .top{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line);gap:10px}
  .sheet .top h3{font-weight:800;margin:0;font-size:1.2rem;line-height:1.1;letter-spacing:-.01em}
  .sheet .top .sub{color:var(--muted);font-size:.84rem;margin-top:3px;font-weight:500}
  .sheet .x{border:none;background:#eef1f6;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:0 0 auto;color:var(--ink)}
  .sheet .content{overflow-y:auto;padding:14px 18px 24px}
  .scriptlbl{font-weight:800;margin:16px 0 6px;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .script{white-space:pre-wrap;line-height:1.55;font-size:.9rem;background:var(--band);border-radius:12px;padding:12px 14px;max-height:38vh;overflow-y:auto;color:#2a3340}
  .sheetact{display:flex;gap:8px;margin-top:14px}
  .sheetact .act.call{background:var(--brand);color:#fff}
  .sheetact .act.rec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .sheetact .act.done{background:var(--green);color:#fff}

  .notif{background:var(--notif);color:#eef1f6;border-radius:14px;padding:14px 15px;font-size:.95rem;line-height:1.5}
  .notif .nh{font-weight:800;font-size:1rem;margin-bottom:6px;line-height:1.25}
  .notif a{color:#8fb4ff;text-decoration:none}
  .notif .meta{color:#aab2c2;font-size:.84rem;margin-top:8px}
  .notif .reply{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);font-size:.82rem;color:#cdd3df}
  .notif .reply b{color:#fff}
  .brandfoot{text-align:center;color:var(--muted);font-size:.78rem;padding:26px 0 6px;font-weight:500}
  .brandfoot b{color:var(--ink)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Effortless<span class="ai">AI</span></div>
      <div class="kicker">Property Manager's Instant Response</div>
      <h1>Today's Calls</h1>
      <div class="datemeta" id="datemeta">Loading…</div>
      <div class="scopes" id="scopes">
        <button class="scope" data-s="today" data-active="true">Today</button>
        <button class="scope" data-s="yesterday">Yesterday</button>
        <button class="scope" data-s="week">Last 7 days</button>
        <button class="scope" data-s="pending">Pending</button>
      </div>
    </header>

    <div class="controls">
      <div class="chips" id="chips">
        <button class="chip" data-f="all" data-active="true">All</button>
        <button class="chip" data-f="P1"><span class="dot" style="background:var(--p1)"></span>P1</button>
        <button class="chip" data-f="P2"><span class="dot" style="background:var(--p2)"></span>P2</button>
        <button class="chip" data-f="P3"><span class="dot" style="background:var(--p3)"></span>P3</button>
        <button class="chip" data-f="P4"><span class="dot" style="background:var(--p4)"></span>P4</button>
        <span class="sep"></span>
        <button class="chip" data-f="S1"><span class="dot" style="background:var(--s1)"></span>S1</button>
        <button class="chip" data-f="S2"><span class="dot" style="background:var(--s2)"></span>S2</button>
        <button class="chip" data-f="S3"><span class="dot" style="background:var(--s3)"></span>S3</button>
        <button class="chip" data-f="S4"><span class="dot" style="background:var(--s4)"></span>S4</button>
      </div>
      <div class="sortrow">
        <span class="count" id="count"></span>
        <div class="rightctl">
          <button class="exportbtn" id="exportbtn">⤓ CSV</button>
          <button class="sortbtn" id="groupbtn">⊞ By day</button>
          <button class="togglebtn" id="togglebtn" data-on="false">Show handled</button>
          <button class="sortbtn" id="sortbtn">↓ Newest</button>
        </div>
      </div>
    </div>

    <div class="list" id="list">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <div class="brandfoot">Powered by <b>AI Alive</b></div>
  </div>

  <div class="sheet-bg" id="sheetbg"></div>
  <div class="sheet" id="sheet">
    <div class="top">
      <div><h3 id="shTitle"></h3><div class="sub" id="shSub"></div></div>
      <button class="x" id="shX">×</button>
    </div>
    <div class="content" id="shContent"></div>
  </div>

<script>
  const PRI={P1:{c:"--p1",t:"P1 · CRITICAL"},P2:{c:"--p2",t:"P2 · URGENT"},P3:{c:"--p3",t:"P3 · HIGH"},P4:{c:"--p4",t:"P4 · STANDARD"}};
  const STA={S1:{c:"--s1",t:"S1 · URGENT"},S2:{c:"--s2",t:"S2 · ASAP"},S3:{c:"--s3",t:"S3 · WORKING"},S4:{c:"--s4",t:"S4 · COMPLETE"},SU:{c:"--su",t:"🟣 STATUS UPDATE"}};
  const PDOT={P1:"🔴",P2:"🟠",P3:"🟡",P4:"🟢"};
  const SDOT={S1:"🔴",S2:"🟣",S3:"🔵",S4:"🟢",SU:"🟣"};
  const PFULL={P1:"CRITICAL",P2:"URGENT",P3:"HIGH PRIORITY",P4:"STANDARD"};
  const SFULL={S1:"URGENT",S2:"NEEDS ATTENTION",S3:"WORKING / ON-SITE",S4:"COMPLETE",SU:"STATUS UPDATE"};
  const STATE={Calm:"🟢",Urgent:"🟠",Distressed:"🔴",Agro:"⚡"};
  let calls=[],filter="all",desc=true,showHandled=false,scope="today",todayStr="",groupBy="day";

  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const fmtTime=t=>{if(!t)return"";const d=new Date(t);return isNaN(d)?"":d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})};
  const fmtDate=t=>{if(!t)return"";const d=new Date(t);return isNaN(d)?"":d.toLocaleDateString([],{month:"short",day:"numeric"})};
  function addDays(dstr,n){const[y,m,da]=dstr.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,da));dt.setUTCDate(dt.getUTCDate()+n);return dt.toISOString().slice(0,10);}
  function dayHeader(dstr){if(!dstr)return"";if(dstr===todayStr)return"Today";if(todayStr&&dstr===addDays(todayStr,-1))return"Yesterday";const d=new Date(dstr+"T12:00:00");return isNaN(d)?dstr:d.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});}
  const key=v=>(v||"").toString().toUpperCase().slice(0,2);
  const badgeMeta=c=>{const p=key(c.priority),s=key(c.status);
    if(PRI[p]&&STA[s])return[PRI[p],STA[s]];
    if(PRI[p])return[PRI[p]];
    if(STA[s])return[STA[s]];
    return[{c:null,t:"UNCLASSIFIED",unc:true}];};

  function badgesHTML(c){
    return badgeMeta(c).map(m=>m.unc?`<span class="badge unc">${m.t}</span>`
      :`<span class="badge" style="background:var(${m.c})">${m.t}</span>`).join("");
  }
  function barColor(c){const m=badgeMeta(c)[0];return m.c?`var(${m.c})`:"#55555c";}

  function visible(){
    let rows=calls.filter(c=>showHandled?true:!c.resolved);
    if(filter!=="all")rows=rows.filter(c=>key(c.priority)===filter||key(c.status)===filter);
    if(groupBy==="property"){
      rows.sort((a,b)=>{const pa=(a.property||"~~~").toLowerCase(),pb=(b.property||"~~~").toLowerCase();
        if(pa<pb)return -1; if(pa>pb)return 1;
        return (desc?-1:1)*((new Date(a.time||0))-(new Date(b.time||0)));});
    } else {
      rows.sort((a,b)=>(desc?-1:1)*((new Date(a.time||0))-(new Date(b.time||0))));
    }
    return rows;
  }

  function cardHTML(c,i,multiDay){
    const phone=(c.phone||"").replace(/[^0-9+]/g,"");
    const head=c.property||c.name||"Unidentified call";
    const sub=c.property?esc(c.name):(c.callerType?esc(c.callerType):"");
    const oneLine=c.incident||c.statusSummary||c.summary||c.outcome||"";
    const when=(multiDay?fmtDate(c.time)+" · ":"")+fmtTime(c.time);
    return `<div class="card ${c.resolved?'resolved':''}" data-i="${i}">
      <div class="bar" style="background:${barColor(c)}"></div>
      <div class="body">
        <div class="row1">${badgesHTML(c)}
          ${c.callerState&&c.callerState!=='Calm'?`<span class="pill">${STATE[c.callerState]||''} ${esc(c.callerState)}</span>`:''}
          <span class="time">${when}</span></div>
        <div class="prop" data-open="${i}">${esc(head)}</div>
        ${sub?`<div class="who" data-open="${i}">${sub}</div>`:''}
        ${oneLine?`<div class="line" data-open="${i}">${esc(oneLine)}</div>`:'<div class="line" data-open="'+i+'" style="opacity:.45">Tap for details</div>'}
        <div class="actions">
          <a class="act call" href="${phone?'tel:'+phone:'#'}" style="${phone?'':'opacity:.4;pointer-events:none'}">Call back</a>
          <button class="act rec" data-rec="${i}" ${c.hasRecording?'':'style="opacity:.4;pointer-events:none"'}>▶ Recording</button>
          <button class="act done" data-done-btn="${i}" data-done="${c.resolved}">${c.resolved?'Handled ✓':'Mark handled'}</button>
        </div>
        <div class="audio" id="aud-${i}"></div>
      </div></div>`;
  }

  function render(){
    const list=document.getElementById("list");
    const rows=visible();
    document.getElementById("count").textContent=rows.length+(rows.length===1?" call":" calls");
    if(!rows.length){list.innerHTML='<div class="empty">'+(scope==='pending'?'Nothing pending — all caught up.':'No calls in this view.')+'</div>';return;}
    const byProp=(groupBy==="property");
    const multiDay=(scope==='week'||scope==='pending');
    const groupedByDay=((scope==='week')&&!byProp);
    let html="",lastKey=null,first=true;
    rows.forEach((c,i)=>{
      if(byProp){
        const pk=c.property||"Property unspecified";
        if(pk!==lastKey){html+=`<div class="daygroup ${first?'first':''}">${esc(pk)}</div>`;lastKey=pk;first=false;}
      } else if(groupedByDay){
        if(c.day!==lastKey){html+=`<div class="daygroup ${first?'first':''}">${dayHeader(c.day)}</div>`;lastKey=c.day;first=false;}
      }
      html+=cardHTML(c,i,multiDay||byProp);
    });
    list.innerHTML=html;
    list.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>openSheet(rows[+el.dataset.open])));
    list.querySelectorAll("[data-rec]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();toggleRec(rows[+b.dataset.rec],+b.dataset.rec);}));
    list.querySelectorAll("[data-done-btn]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();toggleDone(rows[+b.dataset.doneBtn]);}));
  }

  function toggleRec(c,i){
    const slot=document.getElementById("aud-"+i);
    if(slot.dataset.open==="1"){slot.innerHTML="";slot.dataset.open="0";return;}
    slot.innerHTML=`<audio controls autoplay preload="none" src="/api/recording/${encodeURIComponent(c.messageId)}"></audio>`;
    slot.dataset.open="1";
  }

  async function toggleDone(c){
    const next=!c.resolved;c.resolved=next;render();
    try{await fetch("/api/resolve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:c.id,contactId:c.contactId,resolved:next})});}
    catch(e){c.resolved=!next;render();}
  }

  function kv(k,v){return v?`<div class="kv"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`:"";}
  function openSheet(c){
    const bg=document.getElementById("sheetbg"),sh=document.getElementById("sheet");
    document.getElementById("shTitle").textContent=c.property||c.name||"Call details";
    document.getElementById("shSub").textContent=[c.name&&c.property?c.name:null,c.city,fmtTime(c.time)].filter(Boolean).join(" · ");
    const internal=(c.callType==='internal')||!!c.status;
    const pk=key(c.priority),sk=key(c.status);
    const phone=(c.phone||"").replace(/[^0-9+]/g,"");
    const issue=c.incident||c.summary||c.outcome||"";
    const mapQ=c.property?encodeURIComponent([c.property,c.city,c.state].filter(Boolean).join(" ")):"";
    const stateLine=c.callerState?`${STATE[c.callerState]||''} Caller ${esc(c.callerState.toLowerCase())}`:"";

    let head, reply, whoLine;
    if(internal){
      head=`${SDOT[sk]||'⚪'} STATUS ${sk||''} — ${SFULL[sk]||esc(c.status||'')} — ${esc(c.property||c.name||'')}`;
      whoLine=`${esc(c.name||'')}${c.identifiedAs?` (${esc(c.identifiedAs)})`:''}${issue?`: ${esc(issue)}`:''}`;
      reply=`Reply <b>OK</b> to acknowledge · <b>WAIT / RESCHED / NEXT</b> to direct`;
    }else{
      head=`${PDOT[pk]||'⚪'} ${pk?pk+' ':''}${PFULL[pk]||'UNCLASSIFIED'} — ${esc(c.property||c.name||'')}`;
      whoLine=`${esc(c.name||'')}${issue?`: ${esc(issue)}`:''}`;
      reply=`Reply <b>OK</b> to acknowledge · <b>DONE</b> when resolved · <b>ESC</b> to escalate`;
    }
    const links=[
      c.hasRecording?`<a href="/api/recording/${encodeURIComponent(c.messageId)}" target="_blank" rel="noopener">▶️ Recording</a>`:'',
      mapQ?`<a href="https://maps.google.com/?q=${mapQ}" target="_blank" rel="noopener">📍 Map</a>`:''
    ].filter(Boolean).join(" · ");

    let notif=`<div class="notif">
      <div class="nh">${head}</div>
      <div>${whoLine}</div>
      ${phone?`<div>Call or text: <a href="tel:${phone}">${esc(c.phone)}</a> · Press &amp; Hold to Forward</div>`:''}
      ${(c.priorityReason&&!internal)?`<div class="meta">${esc(c.priorityReason)}</div>`:''}
      ${stateLine?`<div class="meta">${stateLine}</div>`:''}
      ${links?`<div class="meta">${links}</div>`:''}
      ${(c.photoRequested==='yes')?`<div class="meta">📷 Photo requested</div>`:''}
      <div class="reply">${reply}</div>
    </div>`;

    let controls=`<div class="sheetact">
      ${phone?`<a class="act call" href="tel:${phone}">Call back</a>`:''}
      ${c.hasRecording?`<a class="act rec" href="/api/recording/${encodeURIComponent(c.messageId)}" target="_blank" rel="noopener">▶ Recording</a>`:''}
      <button class="act done" id="shDone">${c.resolved?'Handled ✓':'Mark handled'}</button></div>`;

    let script=c.transcript?`<div class="scriptlbl">Transcript</div><div class="script">${esc(c.transcript)}</div>`:"";

    document.getElementById("shContent").innerHTML=notif+controls+script;
    const sd=document.getElementById("shDone");
    if(sd)sd.addEventListener("click",()=>{toggleDone(c);sd.textContent=c.resolved?'Handled ✓':'Mark handled';});
    bg.classList.add("open");sh.classList.add("open");
  }
  function closeSheet(){document.getElementById("sheetbg").classList.remove("open");document.getElementById("sheet").classList.remove("open");}
  document.getElementById("shX").addEventListener("click",closeSheet);
  document.getElementById("sheetbg").addEventListener("click",closeSheet);

  document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
    document.querySelectorAll(".chip").forEach(c=>c.dataset.active="false");b.dataset.active="true";filter=b.dataset.f;render();});
  document.getElementById("sortbtn").addEventListener("click",e=>{desc=!desc;e.currentTarget.textContent=desc?"↓ Newest":"↑ Oldest";render();});
  document.getElementById("groupbtn").addEventListener("click",e=>{groupBy=(groupBy==="day")?"property":"day";e.currentTarget.textContent=(groupBy==="day")?"⊞ By day":"⊞ By property";render();});
  document.getElementById("togglebtn").addEventListener("click",e=>{showHandled=!showHandled;e.currentTarget.dataset.on=showHandled;e.currentTarget.textContent=showHandled?"Hide handled":"Show handled";render();});

  function setDateMeta(d){
    const fmtFull=ds=>{const x=new Date(ds+"T12:00:00");return isNaN(x)?ds:x.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});};
    let txt="";
    if(scope==='today')txt=fmtFull(d.date)+" · "+(d.tz||"");
    else if(scope==='yesterday')txt="Yesterday · "+fmtFull(addDays(d.date,-1));
    else if(scope==='week')txt="Last 7 days · through "+fmtFull(d.date);
    else if(scope==='pending')txt="Pending · unhandled across recent days";
    document.getElementById("datemeta").textContent=txt;
  }

  async function load(){
    document.getElementById("list").innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    try{
      const r=await fetch("/api/calls?scope="+encodeURIComponent(scope));const d=await r.json();
      if(d.error){document.getElementById("list").innerHTML='<div class="err">'+esc(d.error)+'</div>';document.getElementById("datemeta").textContent="";return;}
      calls=d.calls||[];todayStr=d.date||"";
      setDateMeta(d);
      render();
    }catch(e){document.getElementById("list").innerHTML='<div class="err">Could not reach the server.</div>';}
  }

  document.getElementById("exportbtn").addEventListener("click",()=>{window.location.href="/api/export.csv?scope="+encodeURIComponent(scope);});

  document.getElementById("scopes").addEventListener("click",e=>{
    const b=e.target.closest(".scope");if(!b)return;
    document.querySelectorAll(".scope").forEach(s=>s.dataset.active="false");b.dataset.active="true";
    scope=b.dataset.s;
    desc=(scope!=='pending');                                  // pending defaults oldest-first
    document.getElementById("sortbtn").textContent=desc?"↓ Newest":"↑ Oldest";
    showHandled=false;
    const tog=document.getElementById("togglebtn");
    tog.dataset.on="false";tog.textContent="Show handled";
    tog.style.display=(scope==='pending')?'none':'';           // nothing handled to show in pending
    load();
  });

  load();
</script>
</body>
</html>
